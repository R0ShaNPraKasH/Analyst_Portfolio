{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h4>Transfer Money</h4>
            </div>
            <div class="card-body">
                <p>Current Balance: <strong>₹{{ user.customer.balance }}</strong></p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-dark w-100">Send Money</button>
                </form>
                <br>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary w-100">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
