{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4>Apply for a Loan</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-info">
                    <strong>Note:</strong> Loans are subject to approval based on your Net Worth and Credit Score.
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-warning w-100">Submit Application</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
